# TimeLoom — Docker Compose (target: Linux Intel Xeon server)
# Services: PostgreSQL + Redis + Next.js app + Worker
version: "3.8"

services:
  # === PostgreSQL ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timeloom
      POSTGRES_USER: timeloom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timeloom_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeloom"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Redis (untuk job queue M2+) ===
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Next.js App ===
  app:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://timeloom:${POSTGRES_PASSWORD:-timeloom_password}@postgres:5432/timeloom
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      STORAGE_ROOT: /app/storage
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-2.5-flash}
      GEMINI_MOCK: ${GEMINI_MOCK:-}
      TZ_OPERATOR: ${TZ_OPERATOR:-Asia/Jakarta}
    volumes:
      - storage:/app/storage
      - ./fonts:/app/fonts:ro
    depends_on:
      postgres:
        condition: service_healthy

  # === Worker (job queue processor + file watcher) ===
  worker:
    build:
      context: .
      target: production
    command: node --loader tsx/esm src/worker/index.ts
    environment:
      DATABASE_URL: postgresql://timeloom:${POSTGRES_PASSWORD:-timeloom_password}@postgres:5432/timeloom
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      STORAGE_ROOT: /app/storage
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-2.5-flash}
      GEMINI_MOCK: ${GEMINI_MOCK:-}
      TZ_OPERATOR: ${TZ_OPERATOR:-Asia/Jakarta}
    volumes:
      - storage:/app/storage
      - ./fonts:/app/fonts:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  storage:
